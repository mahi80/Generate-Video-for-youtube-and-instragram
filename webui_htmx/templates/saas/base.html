<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0614">
  <title>{% block title %}Create videos{% endblock %} · MoneyPrinterTurbo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="/static/saas.css">
  <link rel="stylesheet" href="/static/saas-theme.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body class="saas">
  <div id="busy" class="busy" aria-hidden="true"></div>
  {% if user %}{% include "nav.html" %}{% endif %}
  <main class="saas-main">{% block content %}{% endblock %}</main>
  <script>
    document.body.addEventListener("htmx:beforeRequest", function () { document.getElementById("busy").classList.add("htmx-request"); });
    document.body.addEventListener("htmx:afterRequest", function () { document.getElementById("busy").classList.remove("htmx-request"); });

    // Confetti when a video you're watching finishes (once per video).
    document.body.addEventListener("htmx:afterSwap", function (event) {
      var card = event.detail.target;
      if (!card || !card.classList || !card.classList.contains("job-big")) return;
      card = document.getElementById(card.id) || card;
      if (!card.classList.contains("status-complete") || window["done-" + card.id]) return;
      window["done-" + card.id] = true;
      confetti();
    });

    function confetti() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var canvas = document.createElement("canvas");
      canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:500";
      document.body.appendChild(canvas);
      var ctx = canvas.getContext("2d");
      var w = canvas.width = innerWidth, h = canvas.height = innerHeight;
      var colors = ["#ff4fd8", "#ff8a3d", "#ffe14d", "#2ee6ff", "#b4ff4a", "#7c5cff"];
      var pieces = Array.from({length: 160}, function () {
        return {x: w / 2 + (Math.random() - .5) * 200, y: h * .35, vx: (Math.random() - .5) * 16,
                vy: -Math.random() * 16 - 6, r: Math.random() * 6 + 4, a: Math.random() * 6,
                spin: (Math.random() - .5) * .4, c: colors[Math.floor(Math.random() * colors.length)]};
      });
      var start = performance.now();
      (function frame(now) {
        ctx.clearRect(0, 0, w, h);
        pieces.forEach(function (p) {
          p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.spin;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
          ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
        });
        if (now - start < 3200) requestAnimationFrame(frame); else canvas.remove();
      })(start);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
