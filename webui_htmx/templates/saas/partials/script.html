{% if error %}
<div class="alert alert-error" role="alert"><span class="msym">error</span><div>{{ error }}</div></div>
<div class="row-actions">
  <button type="button" class="btn btn-primary btn-lg"
    hx-post="/create/script" hx-include="#wizard" hx-target="#script-step" hx-disabled-elt="this">
    <span class="msym" aria-hidden="true">auto_awesome</span> Try again
  </button>
</div>
{% else %}
<textarea id="script" name="script" rows="8" maxlength="6000"
  placeholder="Type what the voice should say. Short sentences work best."
  hx-post="/create/estimate" hx-include="#wizard" hx-trigger="input changed delay:500ms" hx-target="#estimate">{{ script or "" }}</textarea>
<input type="hidden" name="terms" value="{{ terms or '' }}">
<div class="script-meta">
  <span class="muted"><span class="msym" aria-hidden="true">schedule</span> <span id="estimate">{% if seconds %}About {{ seconds }} seconds{% else %}About 0 seconds{% endif %}</span></span>
  <button type="button" class="btn btn-tertiary"
    hx-post="/create/script" hx-include="#wizard" hx-target="#script-step" hx-disabled-elt="this">
    <span class="msym" aria-hidden="true">refresh</span> Try another one
  </button>
</div>
<div class="create-cta" hx-swap-oob="innerHTML:#result">
  <p class="muted">Script looking good? We'll record the voice, find footage for every line, add captions and music. You just sit back 😎</p>
  <button type="button" class="btn btn-primary btn-xl"
    hx-post="/create/start" hx-include="#wizard" hx-target="#result" hx-disabled-elt="this">
    Create my video 🚀
  </button>
</div>
{% endif %}
